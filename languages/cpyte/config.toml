name = "Cpyte"
grammar = "cpyte"
path_suffixes = ["cpy"]
line_comments = ["#"]
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string"] },
]
auto_indent_using_last_non_empty_line = false
increase_indent_pattern = "^[^#].*:\\s*(#.*)?$"
decrease_indent_patterns = [
    { pattern = "^\\s*elif\\b.*:\\s*(#.*)?", valid_after = ["if", "elif"] },
    { pattern = "^\\s*else\\b.*:\\s*(#.*)?", valid_after = ["if", "elif", "for", "while", "switch", "try", "except"] },
    { pattern = "^\\s*except\\b.*:\\s*(#.*)?", valid_after = ["try", "except"] },
    { pattern = "^\\s*case\\b.*:\\s*(#.*)?", valid_after = ["switch", "case"] },
    { pattern = "^\\s*default\\b.*:\\s*(#.*)?", valid_after = ["switch", "case"] },
]
language_servers = ["cpyte-lsp"]
